<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Options Ratio Screener</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #7d8590;
    --green: #3fb950;
    --green-bright: #56d364;
    --yellow: #d29922;
    --red: #f85149;
    --blue: #58a6ff;
    --purple: #bc8cff;
    --cyan: #39c5cf;
    --accent: #1f6feb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
    font-size: 13px;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 15px; font-weight: 600; color: var(--text); }
  header .subtitle { color: var(--text-muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 0;
    height: calc(100vh - 49px);
  }

  /* ── Sidebar ── */
  aside {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .section-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  label { display: block; color: var(--text-muted); font-size: 11px; margin-bottom: 4px; }
  input, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .btn-group { display: flex; gap: 8px; flex-direction: column; }
  button {
    width: 100%;
    padding: 8px 0;
    border-radius: 6px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s, transform .05s;
  }
  button:active { transform: scale(.98); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: .9; }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-secondary {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--text-muted); color: var(--text); }

  .load-exp-btn {
    width: auto;
    padding: 5px 10px;
    font-size: 11px;
    background: var(--surface2);
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 5px;
    cursor: pointer;
    margin-top: 4px;
  }
  .load-exp-btn:hover { color: var(--text); }

  /* stats row */
  .stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .stat { display: flex; flex-direction: column; }
  .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
  .stat-value { font-size: 15px; font-weight: 600; color: var(--text); }

  /* ── Main content ── */
  main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Chart ── */
  .chart-area {
    padding: 16px 20px 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .chart-title { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .05em; }
  #chain-chart {
    width: 100%;
    height: 110px;
    display: block;
  }

  /* ── Table ── */
  .table-wrap {
    flex: 1;
    overflow: auto;
    padding: 0 0 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    text-align: right;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-muted);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  thead th:first-child { text-align: center; }
  thead th:hover { color: var(--text); }
  thead th.sorted { color: var(--blue); }
  thead th.sorted::after { content: " ↓"; }
  thead th.sorted.asc::after { content: " ↑"; }

  tbody tr {
    border-bottom: 1px solid #1e242b;
    transition: background .1s;
  }
  tbody tr:hover { background: var(--surface2); }
  td {
    padding: 7px 12px;
    text-align: right;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  td:first-child { text-align: center; color: var(--text-muted); }
  td.strike { color: var(--blue); font-weight: 500; }

  /* colour badges */
  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .green-bright { color: var(--green-bright); }
  .green { color: var(--green); }
  .yellow { color: var(--yellow); }
  .red { color: var(--red); }
  .cyan { color: var(--cyan); }
  .purple { color: var(--purple); }

  .ratio-badge {
    background: #1f2d3d;
    color: var(--blue);
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }

  /* ── State messages ── */
  .state-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-muted);
  }
  .state-box .icon { font-size: 36px; }
  .state-box p { font-size: 13px; max-width: 300px; text-align: center; line-height: 1.5; }
  .error-msg { color: var(--red); }

  /* spinner */
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Progress bar ── */
  #progress-bar {
    height: 2px;
    background: var(--accent);
    width: 0;
    transition: width .3s;
    position: fixed;
    top: 0; left: 0;
  }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 20px; right: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 12px;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    max-width: 320px;
  }
  #toast.show { opacity: 1; }
  #toast.err { border-color: var(--red); color: var(--red); }

  /* ── Tooltip ── */
  .help {
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--border);
    color: var(--text-muted);
    font-size: 10px;
    text-align: center;
    line-height: 14px;
    cursor: help;
    margin-left: 4px;
    vertical-align: middle;
  }

  /* legend */
  .legend {
    padding: 8px 20px;
    font-size: 11px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div id="progress-bar"></div>
<div id="toast"></div>

<header>
  <div class="dot"></div>
  <h1>Options Ratio Screener</h1>
  <span class="subtitle">IBKR Real-Time · Ratio Bull Spreads</span>
</header>

<div class="layout">
  <!-- ── Sidebar ── -->
  <aside>
    <div>
      <div class="section-label">Underlying</div>
      <label>Symbol</label>
      <input id="symbol" type="text" value="SPY" placeholder="SPY" style="text-transform:uppercase">

      <label style="margin-top:10px">
        Expiration
        <span class="help" title="Load available expirations after entering a symbol">?</span>
      </label>
      <select id="expiration"></select>
      <button class="load-exp-btn" id="btn-load-exp">Load expirations ↺</button>
    </div>

    <div>
      <div class="section-label">Spread filters</div>
      <div class="row2">
        <div>
          <label>Max ratio (N)</label>
          <select id="ratio">
            <option value="1">1:1</option>
            <option value="2">1:2</option>
            <option value="3">1:3</option>
            <option value="4" selected>1:4</option>
          </select>
        </div>
        <div>
          <label>Max gap</label>
          <select id="gap">
            <option value="1">1 strike</option>
            <option value="2">2 strikes</option>
            <option value="3">3 strikes</option>
            <option value="4" selected>4 strikes</option>
          </select>
        </div>
      </div>
      <label style="margin-top:10px">Min funded % <span class="help" title="Short premium must cover at least X% of long ask">?</span></label>
      <input id="min-funding" type="number" value="0" min="0" max="200" step="5">
    </div>

    <div>
      <div class="section-label">Strike range (optional)</div>
      <div class="row2">
        <div>
          <label>Low</label>
          <input id="strike-low" type="number" placeholder="e.g. 450">
        </div>
        <div>
          <label>High</label>
          <input id="strike-high" type="number" placeholder="e.g. 520">
        </div>
      </div>
    </div>

    <div>
      <div class="section-label">Display</div>
      <label>Top results</label>
      <input id="top" type="number" value="30" min="5" max="100" step="5">
      <label style="margin-top:10px; display:flex; align-items:center; gap:6px; cursor:pointer">
        <input id="no-otm" type="checkbox" style="width:auto">
        Fetch all strikes (no OTM filter)
      </label>
    </div>

    <div class="btn-group">
      <button class="btn-primary" id="btn-screen">▶ Screen</button>
      <button class="btn-secondary" id="btn-clear">Clear</button>
    </div>

    <!-- Connection info -->
    <div style="margin-top:auto; padding-top:16px; border-top: 1px solid var(--border)">
      <div class="section-label">Connection</div>
      <div style="font-size:11px; color:var(--text-muted); line-height:1.7">
        Host: <span style="color:var(--text)" id="conn-host">—</span><br>
        Port: <span style="color:var(--text)" id="conn-port">—</span>
      </div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main id="main-area">
    <div class="state-box" id="idle-state">
      <div class="icon">📊</div>
      <p>Enter a symbol, load expirations, set your filters and click <strong>Screen</strong>.</p>
    </div>
  </main>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const symbolInput    = document.getElementById("symbol");
const expirationSel  = document.getElementById("expiration");
const ratioSel       = document.getElementById("ratio");
const gapSel         = document.getElementById("gap");
const minFundingInp  = document.getElementById("min-funding");
const strikeLowInp   = document.getElementById("strike-low");
const strikeHighInp  = document.getElementById("strike-high");
const topInp         = document.getElementById("top");
const noOtmChk       = document.getElementById("no-otm");
const btnScreen      = document.getElementById("btn-screen");
const btnClear       = document.getElementById("btn-clear");
const btnLoadExp     = document.getElementById("btn-load-exp");
const mainArea       = document.getElementById("main-area");
const progressBar    = document.getElementById("progress-bar");
const toast          = document.getElementById("toast");

// ── Toast ────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, isErr = false) {
  toast.textContent = msg;
  toast.className = "show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.className = "", 3500);
}

// ── Progress bar ─────────────────────────────────────────────────────────────
let progTimer;
function startProgress() {
  progressBar.style.width = "0";
  let w = 0;
  progTimer = setInterval(() => {
    w = Math.min(w + Math.random() * 8, 85);
    progressBar.style.width = w + "%";
  }, 400);
}
function endProgress() {
  clearInterval(progTimer);
  progressBar.style.width = "100%";
  setTimeout(() => progressBar.style.width = "0", 400);
}

// ── Load expirations ──────────────────────────────────────────────────────────
btnLoadExp.addEventListener("click", async () => {
  const sym = symbolInput.value.trim().toUpperCase();
  if (!sym) { showToast("Enter a symbol first", true); return; }
  btnLoadExp.disabled = true;
  btnLoadExp.textContent = "Loading…";
  try {
    const r = await fetch(`/api/expirations?symbol=${encodeURIComponent(sym)}`);
    const data = await r.json();
    if (!r.ok) { showToast(data.error || "Failed to load expirations", true); return; }
    expirationSel.innerHTML = "";
    data.expirations.forEach(e => {
      const opt = document.createElement("option");
      opt.value = e.value;
      opt.textContent = e.label;
      expirationSel.appendChild(opt);
    });
    showToast(`${data.expirations.length} expirations loaded for ${sym}`);
  } catch(e) {
    showToast("Network error: " + e.message, true);
  } finally {
    btnLoadExp.disabled = false;
    btnLoadExp.textContent = "Load expirations ↺";
  }
});

// ── Screen ────────────────────────────────────────────────────────────────────
btnScreen.addEventListener("click", runScreen);
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.ctrlKey) runScreen(); });

async function runScreen() {
  const sym = symbolInput.value.trim().toUpperCase();
  const exp = expirationSel.value;
  if (!sym)  { showToast("Enter a symbol", true); return; }
  if (!exp)  { showToast("Load and select an expiration", true); return; }

  btnScreen.disabled = true;
  btnScreen.textContent = "Fetching…";
  startProgress();
  setMainState("loading", `Connecting to IBKR and fetching ${sym} chain…`);

  const body = {
    symbol: sym,
    expiration: exp,
    ratio: +ratioSel.value,
    gap: +gapSel.value,
    min_funding: +minFundingInp.value || 0,
    top: +topInp.value || 30,
    no_otm_filter: noOtmChk.checked,
    strike_low: strikeLowInp.value ? +strikeLowInp.value : null,
    strike_high: strikeHighInp.value ? +strikeHighInp.value : null,
  };

  try {
    const r  = await fetch("/api/screen", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await r.json();

    if (data.error) {
      setMainState("error", data.error);
      showToast(data.error, true);
      return;
    }
    renderResults(data);
  } catch(e) {
    setMainState("error", e.message);
    showToast("Error: " + e.message, true);
  } finally {
    endProgress();
    btnScreen.disabled = false;
    btnScreen.textContent = "▶ Screen";
  }
}

// ── Clear ────────────────────────────────────────────────────────────────────
btnClear.addEventListener("click", () => {
  setMainState("idle");
});

// ── State helpers ─────────────────────────────────────────────────────────────
function setMainState(state, msg = "") {
  if (state === "idle") {
    mainArea.innerHTML = `
      <div class="state-box" id="idle-state">
        <div class="icon">📊</div>
        <p>Enter a symbol, load expirations, set your filters and click <strong>Screen</strong>.</p>
      </div>`;
  } else if (state === "loading") {
    mainArea.innerHTML = `
      <div class="state-box">
        <div class="spinner"></div>
        <p>${msg}</p>
      </div>`;
  } else if (state === "error") {
    mainArea.innerHTML = `
      <div class="state-box">
        <div class="icon">⚠️</div>
        <p class="error-msg">${escHtml(msg)}</p>
      </div>`;
  }
}

// ── Render results ────────────────────────────────────────────────────────────
let sortCol = "score", sortAsc = false;
let lastData = null;

function renderResults(data) {
  lastData = data;
  const expFmt = data.expiration
    ? `${data.expiration.slice(0,4)}-${data.expiration.slice(4,6)}-${data.expiration.slice(6)}`
    : data.expiration;
  const upStr = data.underlying_price != null ? `$${data.underlying_price.toFixed(2)}` : "N/A";

  mainArea.innerHTML = `
    <div class="stats" id="stats-row"></div>
    <div class="chart-area">
      <div class="chart-title">Call chain · bid/ask by strike</div>
      <canvas id="chain-chart"></canvas>
    </div>
    <div class="table-wrap">
      <table id="results-table">
        <thead>
          <tr>
            <th>#</th>
            <th data-col="long_strike" class="sorted">Long K</th>
            <th data-col="short_strike">Short K</th>
            <th data-col="ratio">Ratio</th>
            <th data-col="gap">Gap</th>
            <th data-col="long_ask">Long ask</th>
            <th data-col="short_bid">Short bid</th>
            <th data-col="net_debit">Net $/sh</th>
            <th data-col="funding_pct">Funded %</th>
            <th data-col="lower_be">Lower BE</th>
            <th data-col="upper_be">Upper BE</th>
            <th data-col="max_profit">Max profit $</th>
            <th data-col="score" class="sorted">Score</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
    </div>
    <div class="legend">
      Score = −(net_debit / spread_width) · higher is better · green net = credit · upper BE only for ratio &gt; 1:1
    </div>`;

  // Stats
  const statsRow = document.getElementById("stats-row");
  [
    ["Symbol", data.symbol],
    ["Expiration", expFmt],
    ["Underlying", upStr],
    ["Strikes fetched", data.strikes_fetched],
    ["Valid quotes", data.valid_quotes],
    ["Candidates", data.candidates.length],
  ].forEach(([label, val]) => {
    const d = document.createElement("div");
    d.className = "stat";
    d.innerHTML = `<span class="stat-label">${label}</span><span class="stat-value">${val}</span>`;
    statsRow.appendChild(d);
  });

  // Sortable headers
  sortCol = "score"; sortAsc = false;
  document.querySelectorAll("thead th[data-col]").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.dataset.col;
      if (sortCol === col) sortAsc = !sortAsc;
      else { sortCol = col; sortAsc = false; }
      document.querySelectorAll("thead th").forEach(t => {
        t.classList.remove("sorted", "asc");
      });
      th.classList.add("sorted");
      if (sortAsc) th.classList.add("asc");
      renderBody(lastData.candidates);
    });
  });

  renderBody(data.candidates);
  drawChart(data.chain, data.candidates);
}

function renderBody(candidates) {
  const sorted = [...candidates].sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (typeof av === "string" && av !== "∞") av = parseFloat(av);
    if (typeof bv === "string" && bv !== "∞") bv = parseFloat(bv);
    if (av === "∞") av = 1e18;
    if (bv === "∞") bv = 1e18;
    return sortAsc ? av - bv : bv - av;
  });

  const tbody = document.getElementById("results-body");
  tbody.innerHTML = "";
  sorted.forEach((c, idx) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${idx + 1}</td>
      <td class="strike">${c.long_strike.toFixed(2)}</td>
      <td class="strike">${c.short_strike.toFixed(2)}</td>
      <td><span class="ratio-badge">${escHtml(c.ratio)}</span></td>
      <td style="color:var(--text-muted)">${c.gap}</td>
      <td>${c.long_ask.toFixed(2)}</td>
      <td>${c.short_bid.toFixed(2)}</td>
      <td>${colorDebit(c.net_debit)}</td>
      <td>${colorFunding(c.funding_pct)}</td>
      <td style="color:var(--text-muted)">${c.lower_be.toFixed(2)}</td>
      <td style="color:var(--text-muted)">${c.upper_be}</td>
      <td style="color:var(--purple)">${c.max_profit >= 0 ? "+" : ""}${c.max_profit.toFixed(0)}</td>
      <td>${colorScore(c.score)}</td>`;
    tbody.appendChild(tr);
  });
}

// ── Chart ─────────────────────────────────────────────────────────────────────
function drawChart(chain, candidates) {
  const canvas = document.getElementById("chain-chart");
  if (!canvas || !chain || chain.length === 0) return;
  const ctx = canvas.getContext("2d");

  // Responsive sizing
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = 110 * dpr;
  canvas.style.width  = rect.width + "px";
  canvas.style.height = "110px";
  ctx.scale(dpr, dpr);

  const W = rect.width, H = 110;
  const PAD = { top: 10, right: 20, bottom: 24, left: 40 };
  const cW = W - PAD.left - PAD.right;
  const cH = H - PAD.top - PAD.bottom;

  const strikes  = chain.map(d => d.strike);
  const asks     = chain.map(d => d.ask);
  const bids     = chain.map(d => d.bid);

  const minS = Math.min(...strikes), maxS = Math.max(...strikes);
  const maxP = Math.max(...asks.filter(v => v != null));
  const xScale = s => PAD.left + (s - minS) / (maxS - minS || 1) * cW;
  const yScale = v => PAD.top + cH - (v / (maxP || 1)) * cH;

  // Grid lines
  ctx.strokeStyle = "#1e242b";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = PAD.top + (cH / 4) * i;
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(W - PAD.right, y); ctx.stroke();
    const val = maxP * (1 - i / 4);
    ctx.fillStyle = "#4d5561";
    ctx.font = "9px monospace";
    ctx.textAlign = "right";
    ctx.fillText(val.toFixed(2), PAD.left - 3, y + 3);
  }

  // Highlight long strikes of top candidates
  const topLong = new Set((candidates || []).slice(0, 5).map(c => c.long_strike));
  const topShort = new Set((candidates || []).slice(0, 5).map(c => c.short_strike));

  chain.forEach(d => {
    const x = xScale(d.strike);
    if (topLong.has(d.strike)) {
      ctx.strokeStyle = "rgba(88,166,255,0.3)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, PAD.top); ctx.lineTo(x, H - PAD.bottom); ctx.stroke();
    }
    if (topShort.has(d.strike)) {
      ctx.strokeStyle = "rgba(248,81,73,0.25)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, PAD.top); ctx.lineTo(x, H - PAD.bottom); ctx.stroke();
    }
  });

  // Ask line
  ctx.strokeStyle = "#f8514950";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  chain.forEach((d, i) => {
    if (d.ask == null) return;
    const x = xScale(d.strike), y = yScale(d.ask);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Bid line
  ctx.strokeStyle = "#3fb95080";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  chain.forEach((d, i) => {
    if (d.bid == null) return;
    const x = xScale(d.strike), y = yScale(d.bid);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Mid dots
  ctx.fillStyle = "#58a6ff";
  chain.forEach(d => {
    if (d.mid == null) return;
    ctx.beginPath();
    ctx.arc(xScale(d.strike), yScale(d.mid), 2, 0, Math.PI * 2);
    ctx.fill();
  });

  // X-axis strike labels (sample ~6)
  const step = Math.max(1, Math.floor(strikes.length / 6));
  ctx.fillStyle = "#4d5561";
  ctx.font = "9px monospace";
  ctx.textAlign = "center";
  strikes.filter((_, i) => i % step === 0).forEach(s => {
    ctx.fillText(s.toFixed(0), xScale(s), H - PAD.bottom + 13);
  });

  // Legend
  ctx.font = "9px monospace";
  ctx.fillStyle = "#3fb950"; ctx.textAlign = "left";
  ctx.fillText("bid", W - PAD.right - 55, PAD.top + 9);
  ctx.fillStyle = "#f85149";
  ctx.fillText("ask", W - PAD.right - 30, PAD.top + 9);
  ctx.fillStyle = "#58a6ff";
  ctx.fillText("mid", W - PAD.right - 5 , PAD.top + 9);
}

// ── Colour helpers ────────────────────────────────────────────────────────────
function colorDebit(v) {
  if (v < 0) return `<span class="green-bright">−${Math.abs(v).toFixed(2)}</span>`;
  if (v === 0) return `<span class="cyan">0.00</span>`;
  return `<span class="yellow">+${v.toFixed(2)}</span>`;
}
function colorFunding(pct) {
  if (pct >= 100) return `<span class="green-bright">${pct.toFixed(1)}%</span>`;
  if (pct >= 75)  return `<span class="green">${pct.toFixed(1)}%</span>`;
  if (pct >= 50)  return `<span class="yellow">${pct.toFixed(1)}%</span>`;
  return `<span class="red">${pct.toFixed(1)}%</span>`;
}
function colorScore(v) {
  if (v > 0.3)  return `<span class="green-bright">${v.toFixed(4)}</span>`;
  if (v > 0)    return `<span class="green">${v.toFixed(4)}</span>`;
  if (v > -0.1) return `<span class="yellow">${v.toFixed(4)}</span>`;
  return `<span class="red">${v.toFixed(4)}</span>`;
}
function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
